# Copy to $XDG_CONFIG_HOME/agentcord/config.toml. Override the path with
# `--config` or `AGENTCORD_CONFIG`. String values support `${NAME}` expansion.

[discord]
bot_token = "${DISCORD_TOKEN}"
guild_id = 1234567890
allowed_user_id = 1234567890
forum_channel_id = 1234567890

[projects]
base_path = "~/Projects"

[agents.example]
display_name = "Example Agent"
command = "example-agent-acp"
args = ["--stdio"]
env = { EXAMPLE_SETTING = "1" }
tag = { name = "example", emoji = "🤖" }

[agents.custom-emoji]
display_name = "Custom Agent"
command = "/opt/custom-agent/bin/acp"
args = []
tag = { name = "custom", emoji = { id = 123456789012345678, animated = false } }

[permissions]
# Automatically choose ACP's AllowAlways option for every permission request.
approve_all = false

# Integer values are seconds; human durations are also accepted.
[timeouts]
modal = "5m"
startup = "1m"
prompt = "1h"
permission = "5m"
edit_debounce = "100ms"
