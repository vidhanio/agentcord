[package]
name = "agentcord"
version = "0.1.0"
edition = "2024"

license = "AGPL-3.0-or-later"
publish = false

[dependencies]
agent-client-protocol = { version = "2", features = ["unstable_elicitation"] }
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
config = { version = "0.15", default-features = false, features = ["toml"] }
dirs = "5"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The serenity `next` branch (0.13 dev line): Component V2, modal select
# values, reworked ratelimiter.
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = [
  "builder",
  "cache",
  "collector",
  "framework",
  "gateway",
  "http",
  "model",
  "rustls_backend",
  "utils",
] }
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next", default-features = false, features = [
  "cache",
  "handle_panics",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
# missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

missing_errors_doc = "allow"
module_name_repetitions = "allow"

nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
