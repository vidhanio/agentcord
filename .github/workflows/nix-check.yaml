name: nix check

on:
  workflow_call:
    inputs:
      name:
        description: name for the check job
        required: true
        type: string
      command:
        description: command to run after nix setup
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  check:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: free disk space
        uses: wimpysworld/nothing-but-nix@v10

      - name: install nix
        uses: cachix/install-nix-action@v31

      - name: restore nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: run check
        run: ${{ inputs.command }}
