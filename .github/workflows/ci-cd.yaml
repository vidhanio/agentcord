name: CI/CD

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Execute tests
        run: cargo test --all-features --all-targets

  test-docs:
    name: Test Documentation

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run documentation tests
        run: cargo test --doc --all-features

  check:
    name: Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code
        run: cargo clippy --all-targets -- -D warnings

  check-docs:
    name: Check Documentation

    runs-on: ubuntu-latest

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        run: cargo doc --no-deps --all-features

  check-format:
    name: Check Formatting

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@v9

      # treefmt config lives in the flake (treefmt-nix: nixfmt, statix,
      # deadnix, nightly rustfmt, taplo), so the fmt gate is the flake's
      # own treefmt check: it formats the tree and fails on any diff.
      - name: Check formatting
        run: nix build .#checks.x86_64-linux.treefmt
