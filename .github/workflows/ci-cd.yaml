name: CI/CD

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Execute tests
        run: cargo test --all-features --all-targets

  test-docs:
    name: Test Documentation

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run documentation tests
        run: cargo test --doc --all-features

  check:
    name: Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code
        run: cargo clippy --all-targets -- -D warnings

  check-docs:
    name: Check Documentation

    runs-on: ubuntu-latest

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install `cargo-docs-rs`
        uses: dtolnay/install@cargo-docs-rs

      - name: Check documentation
        run: cargo docs-rs --locked

  check-nix:
    name: Check Nix Outputs

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check flake outputs
        run: nix flake check

  check-home-manager:
    name: Check Home Manager Module

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check Home Manager output
        run: |
          nix eval --impure --show-trace --expr '
          let
            flake = builtins.getFlake (toString ./.);
            module = flake.homeManagerModules.default;
            pkgs = import flake.inputs.nixpkgs {
              system = "x86_64-linux";
              overlays = [ flake.inputs.rust-overlay.overlays.default ];
            };
            moduleResult = module {
              inherit pkgs;
              lib = pkgs.lib;
              config = {
                programs.herdcord = {
                  enable = true;
                  settings = {
                    discord = {
                      bot_token = "token";
                      guild_id = 1;
                      allowed_user_id = 2;
                    };
                  };
                };
              };
            };
          in
          assert
            moduleResult.options.programs.herdcord.enable.description
            == "Whether to enable herdcord.";
          assert
            moduleResult.options.programs.herdcord.package.default.pname
            == "herdcord";
          assert moduleResult.options.programs.herdcord.settings.default == { };
          assert moduleResult.config.condition;
          assert builtins.length moduleResult.config.content.home.packages == 1;
          assert
            builtins.hasAttr "herdcord/config.toml"
            moduleResult.config.content.xdg.configFile;
          true
          '

  check-format:
    name: Check Formatting

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@v9

      # treefmt config lives in the flake (treefmt-nix: nixfmt, statix,
      # deadnix, nightly rustfmt, taplo), so the fmt gate is the flake's
      # own treefmt check: it formats the tree and fails on any diff.
      - name: Check formatting
        run: nix build .#checks.x86_64-linux.treefmt
