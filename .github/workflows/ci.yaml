name: ci

on:
  - push
  - pull_request

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: test

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: run tests
        run: cargo test --all-features --all-targets

  test-docs:
    name: test docs

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: run doc tests
        run: cargo test --doc --all-features

  check:
    name: check

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: check code
        run: cargo clippy --all-targets -- -D warnings

  check-docs:
    name: check docs

    runs-on: ubuntu-latest

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install rust
        uses: dtolnay/rust-toolchain@nightly

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: install cargo-docs-rs
        uses: dtolnay/install@cargo-docs-rs

      - name: run cargo docs-rs
        run: cargo docs-rs --locked

  check-nix:
    name: check nix
    uses: ./.github/workflows/nix-check.yaml
    with:
      name: check nix
      command: nix flake check
    permissions:
      actions: write
      contents: read

  check-home-manager:
    name: check home manager
    uses: ./.github/workflows/nix-check.yaml
    with:
      name: check home manager
      command: |
        nix eval --impure --show-trace --expr '
        let
          flake = builtins.getFlake (toString ./.);
          module = flake.homeManagerModules.default;
          pkgs = import flake.inputs.nixpkgs {
            system = "x86_64-linux";
            overlays = [ flake.inputs.rust-overlay.overlays.default ];
          };
          moduleResult = module {
            inherit pkgs;
            lib = pkgs.lib;
            config = {
              programs.herdcord = {
                enable = true;
                settings = {
                  discord = {
                    bot_token = "token";
                    guild_id = 1;
                    allowed_user_id = 2;
                  };
                };
              };
            };
          };
        in
        assert
          moduleResult.options.programs.herdcord.enable.description
          == "Whether to enable herdcord.";
        assert
          moduleResult.options.programs.herdcord.package.default.pname
          == "herdcord";
        assert moduleResult.options.programs.herdcord.settings.default == { };
        assert moduleResult.config.condition;
        assert builtins.length moduleResult.config.content.home.packages == 1;
        assert
          builtins.hasAttr "herdcord/config.toml"
          moduleResult.config.content.xdg.configFile;
        true
        '
    permissions:
      actions: write
      contents: read

  check-format:
    name: check format
    uses: ./.github/workflows/nix-check.yaml
    with:
      name: check format
      command: nix build .#checks.x86_64-linux.treefmt
    permissions:
      actions: write
      contents: read
